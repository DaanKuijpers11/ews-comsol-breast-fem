# Chen-2024 inspired glandular layout:
# - double circular array (8 inner + 10 outer around nipple)
# - teardrop-like lobules via chained Gaussian components toward the nipple
[model.mesh]
density = 140
debug_view = false

[material.tumor]
tumorous = false

[material.glandular.hetero]
enabled = true
auto_generate = true
generator_mode = "chen_2024_double_ring"

# Nipple close to outer contour (radius=0.07 m model)
nipple = [ 0.0, 0.068, 0.0,]

# Base lobe property envelope
# Slightly reduced width plus larger ring radii gives less overlap once the
# COMSOL geometry is built as explicit bulb+duct lobes.
width = 0.0038
amp_c1 = 70.0
amp_c2 = 55.0
amp_rho = 35.0
seed = 42

# Chen-like double ring setup (total lobes = 18)
inner_ring_count = 8
outer_ring_count = 10
inner_ring_radius = 0.007
outer_ring_radius = 0.013
inner_depth = 0.020
outer_depth = 0.030

# Teardrop chain (each lobe split in 2 linked Gaussian components)
droplet_length = 0.012
droplet_components = 2

[material.adipose.hetero]
enabled = true
radial_center = [ 0.0, 0.0, 0.0,]
radial_L = 0.05
radial_alpha_c1 = 20.0
radial_alpha_c2 = 15.0
radial_alpha_rho = 25.0
